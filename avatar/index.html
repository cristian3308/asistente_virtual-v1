<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; -webkit-app-region: drag; cursor: grab; }
      .hud { position: relative; width: 300px; height: 280px; display: grid; place-items: center; }
      .anillos { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 4px rgba(79, 140, 255, .55)); }
      .anillos circle { fill: none; stroke-width: 3.5; stroke-linecap: round; transition: stroke-dasharray .8s ease; }
      .anillos .pista { stroke: rgba(127, 212, 255, .14); }
      .anillos .valor.alerta { stroke: #ff5d5d !important; }
      .robot { position: relative; margin-top: -14px; }
      .chip, .subtitulo { color: #dff6ff; text-shadow: 0 0 6px rgba(0, 0, 0, .9), 0 0 2px #000; text-align: center;
        opacity: 0; transition: opacity .25s ease; max-width: 290px; }
      .chip { font-size: 12px; letter-spacing: .03em; padding: 2px 10px; border-radius: 999px; min-height: 18px;
        background: rgba(10, 25, 45, .55); border: 1px solid rgba(127, 212, 255, .35); }
      .subtitulo { font-size: 13px; line-height: 1.3; min-height: 34px; display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden; background: rgba(10, 25, 45, .5); border-radius: 8px; padding: 3px 8px; }
      .visible { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
